<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pizzaria do Rocha — Fogo na Massa</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>

<script type="module">
import { CONTATO, FOTOS, getItems, photoFor, money } from './store.js';
import { renderNav, renderFooter, renderWhatsApp, esc } from './ui.js';

const C = CONTATO;
const items = getItems().filter((i) => i.ativo !== false);
const featured = items.slice(0, 3);

const featuredHTML = featured.map((p) => `
  <a href="Cardapio.dc.html" class="card" style="text-decoration:none;color:var(--creme);">
    <div class="thumb">
      <img src="${photoFor(p.nome, p.categoria, p.foto)}" alt="${esc(p.nome)} (ilustrativa)">
      <span class="ilustra">Ilustrativa</span>
    </div>
    <div style="padding:20px 22px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <span style="font-size:21px;font-weight:700;">${esc(p.nome)}</span>
        <span style="font-size:20px;color:var(--fogo);font-weight:800;">${money(p.preco)}</span>
      </div>
      <p style="font-size:15px;color:var(--areia);margin:8px 0 0;">${esc(p.descricao)}</p>
    </div>
  </a>`).join('');

document.getElementById('app').innerHTML = `
${renderNav('home')}

<section class="rise" style="position:relative;min-height:92vh;display:flex;align-items:center;padding:0 64px;overflow:hidden;">
  <img src="${FOTOS.hero}" alt="Forno a lenha (ilustrativa)" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:saturate(1.05);">
  <div style="position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(26,18,16,0.94) 0%,rgba(26,18,16,0.82) 42%,rgba(26,18,16,0.35) 100%);"></div>
  <div style="position:relative;z-index:2;max-width:980px;">
    <div style="font-size:15px;font-weight:800;letter-spacing:3px;color:var(--fogo);margin-bottom:22px;">PIZZA DE RUA, FEITA DE VERDADE</div>
    <h1 class="hero-title" style="font-size:150px;line-height:0.9;margin:0;color:var(--creme);text-shadow:0 6px 40px rgba(0,0,0,0.45);">FOGO<br>NA<br>MASSA.</h1>
    <p style="font-size:22px;line-height:1.5;color:#e6dccd;max-width:540px;margin:32px 0 40px;">Massa fermentada 48h, forno a lenha e recheio pesado. Pede no site, acompanha em tempo real, chega quente na sua porta.</p>
    <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;">
      <a href="Cardapio.dc.html" class="btn btn-fogo">VER CARDÁPIO</a>
      <a href="${C.whatsappMsg}" target="_blank" rel="noopener" class="btn btn-ghost">Pedir pelo WhatsApp</a>
    </div>
  </div>
</section>

<div style="background:var(--fogo);color:var(--carvao);display:flex;flex-wrap:wrap;gap:8px 40px;justify-content:center;padding:18px 32px;font-weight:700;font-size:15px;">
  <span>📞 ${esc(C.telefone)}</span><span>📍 ${esc(C.enderecoCurto)}</span><span>🕒 Ter a Dom · 18h às 23h30</span>
</div>

<section style="background:var(--creme);color:var(--carvao);padding:130px 64px;" class="pad">
  <div class="grid-2" style="max-width:1200px;margin:0 auto;">
    <div style="position:relative;">
      <img src="${FOTOS.historia}" alt="Pizzaiolo (ilustrativa)" style="width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:6px;box-shadow:0 30px 60px rgba(0,0,0,0.25);">
      <span class="ilustra" style="left:12px;right:auto;">Imagem ilustrativa</span>
    </div>
    <div>
      <div style="font-size:15px;font-weight:800;letter-spacing:3px;color:var(--fogo);margin-bottom:18px;">NOSSA HISTÓRIA</div>
      <h2 style="font-size:64px;line-height:1.02;margin:0 0 26px;">DA ESQUINA PRO SEU FORNO.</h2>
      <p style="font-size:19px;line-height:1.6;color:#4a3d33;max-width:480px;">A Pizzaria do Rocha nasceu numa esquina de bairro, entre vizinhos, futebol de rua e cheiro de massa assando. Hoje o forno é maior, mas a receita continua a mesma — na <strong>Rua Hait, 155</strong>, em Sete Lagoas.</p>
    </div>
  </div>
</section>

<section style="padding:130px 64px;background:var(--carvao);" class="pad">
  <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:52px;flex-wrap:wrap;gap:20px;">
    <h2 style="font-size:72px;margin:0;">DESTAQUES DA CASA</h2>
    <a href="Cardapio.dc.html" style="font-weight:700;font-size:16px;color:var(--fogo);border-bottom:1px solid var(--fogo);padding-bottom:4px;">Ver cardápio completo →</a>
  </div>
  <div class="grid-3">${featuredHTML}</div>
</section>

<section style="padding:130px 64px;background:var(--creme);color:var(--carvao);" class="pad">
  <h2 style="font-size:64px;margin:0 0 68px;text-align:center;">COMO FUNCIONA</h2>
  <div class="grid-3" style="max-width:1200px;margin:0 auto;gap:56px;">
    <div><div style="font-family:'Bebas Neue';font-size:56px;color:var(--fogo);margin-bottom:14px;">01</div><h3 style="font-size:22px;margin:0 0 10px;font-family:'Work Sans';font-weight:700;">Escolhe a pizza</h3><p style="font-size:16px;color:#4a3d33;line-height:1.6;margin:0;">Navega pelo cardápio e monta o pedido do jeito que quiser.</p></div>
    <div><div style="font-family:'Bebas Neue';font-size:56px;color:var(--fogo);margin-bottom:14px;">02</div><h3 style="font-size:22px;margin:0 0 10px;font-family:'Work Sans';font-weight:700;">Paga com segurança</h3><p style="font-size:16px;color:#4a3d33;line-height:1.6;margin:0;">Pix ou cartão no checkout — processado pela <strong>Asaas</strong>.</p></div>
    <div><div style="font-family:'Bebas Neue';font-size:56px;color:var(--fogo);margin-bottom:14px;">03</div><h3 style="font-size:22px;margin:0 0 10px;font-family:'Work Sans';font-weight:700;">Acompanha ao vivo</h3><p style="font-size:16px;color:#4a3d33;line-height:1.6;margin:0;">Do forno até a sua porta, você vê cada etapa em tempo real.</p></div>
  </div>
</section>

<section id="contato" style="padding:130px 64px;background:var(--carvao);" class="pad">
  <div class="grid-2" style="max-width:1200px;margin:0 auto;">
    <div>
      <div style="font-size:15px;font-weight:800;letter-spacing:3px;color:var(--fogo);margin-bottom:18px;">FALE COM A GENTE</div>
      <h2 style="font-size:68px;line-height:1;margin:0 0 32px;">TÁ COM FOME? BORA.</h2>
      <div style="display:flex;flex-direction:column;gap:20px;margin-bottom:36px;">
        <div style="display:flex;gap:14px;"><span style="font-size:22px;">📞</span><div><div style="font-size:13px;letter-spacing:1px;color:var(--musgo);">TELEFONE / WHATSAPP</div><a href="${C.whatsappMsg}" target="_blank" rel="noopener" style="font-size:20px;font-weight:700;color:var(--creme);">${esc(C.telefone)}</a></div></div>
        <div style="display:flex;gap:14px;"><span style="font-size:22px;">📍</span><div><div style="font-size:13px;letter-spacing:1px;color:var(--musgo);">ENDEREÇO</div><a href="${C.mapsUrl}" target="_blank" rel="noopener" style="font-size:18px;font-weight:600;color:var(--creme);line-height:1.5;">${esc(C.endereco)}</a></div></div>
        <div style="display:flex;gap:14px;"><span style="font-size:22px;">🕒</span><div><div style="font-size:13px;letter-spacing:1px;color:var(--musgo);">HORÁRIO</div><div style="font-size:18px;font-weight:600;color:var(--creme);">Terça a Domingo · 18h às 23h30</div></div></div>
      </div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;">
        <a href="${C.whatsappMsg}" target="_blank" rel="noopener" class="btn btn-zap" style="font-size:16px;padding:16px 28px;">Chamar no WhatsApp</a>
        <a href="tel:${C.telefoneDigits}" class="btn btn-ghost" style="font-size:16px;padding:16px 28px;">Ligar agora</a>
      </div>
    </div>
    <a href="${C.mapsUrl}" target="_blank" rel="noopener" style="display:block;position:relative;border-radius:8px;overflow:hidden;min-height:340px;background:var(--carvao2);">
      <iframe title="Mapa" src="${C.mapEmbed}" style="width:100%;height:100%;min-height:340px;border:0;" loading="lazy"></iframe>
      <span class="ilustra" style="left:12px;right:auto;top:auto;bottom:12px;pointer-events:none;">Toque para abrir no Google Maps</span>
    </a>
  </div>
</section>

${renderFooter()}
${renderWhatsApp()}
`;
</script>
</body>
</html>
