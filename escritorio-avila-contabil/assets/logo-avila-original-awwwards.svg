<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#98752C" />
      <stop offset="35%" stop-color="#C59B43" />
      <stop offset="70%" stop-color="#DFB967" />
      <stop offset="100%" stop-color="#A57D30" />
    </linearGradient>
    
    <!-- Emerald Gradient -->
    <linearGradient id="emeraldGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04120E" />
      <stop offset="100%" stop-color="#0F2D24" />
    </linearGradient>
  </defs>

  <!-- LEFT SYMBOL: Dynamic Upward Growth Ribbon / Arc from original logo -->
  <g transform="translate(6, 4)">
    <!-- Primary dynamic arch -->
    <path d="M4 70 C10 42 22 18 34 2 C38 2 40 4 38 8 C28 24 16 46 12 70 C9 72 4 72 4 70 Z" fill="url(#goldGradLight)" />
    <!-- Secondary internal accent curve -->
    <path d="M14 68 C19 46 30 25 40 10 C42 10 44 12 42 15 C33 28 23 48 20 68 C17 69 14 69 14 68 Z" fill="#071D17" opacity="0.85" />
    <!-- Golden apex star dot -->
    <circle cx="34" cy="4" r="2.5" fill="#DFB967" />
  </g>

  <!-- CENTER LOGOTYPE: ESCRITÓRIO ÁVILA CONTÁBIL -->
  <g transform="translate(56, 0)">
    <!-- Top line: ESCRITÓRIO -->
    <text x="2" y="24" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="3.8" fill="#53665E">ESCRITÓRIO</text>
    
    <!-- Main line: ÁVILA -->
    <text x="0" y="52" font-family="'Fraunces', 'Playfair Display', Georgia, serif" font-size="30" font-weight="700" letter-spacing="4" fill="url(#emeraldGradLight)">ÁVILA</text>
    
    <!-- Acute accent mark in Gold on Á -->
    <path d="M-1 29 L5 25 L8 29" stroke="url(#goldGradLight)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Bottom line: CONTÁBIL -->
    <text x="2" y="68" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="5" fill="#C59B43">CONTÁBIL</text>

    <!-- Sub-badge since 1994 -->
    <line x1="2" y1="74" x2="160" y2="74" stroke="#071D17" stroke-width="0.8" stroke-opacity="0.18" />
  </g>

  <!-- RIGHT SYMBOL: Orbital Globe & Meridian Sphere from original logo -->
  <g transform="translate(242, 10)">
    <!-- Globe Outer Ring / Meridian Sphere -->
    <circle cx="28" cy="28" r="26" stroke="#071D17" stroke-width="1.2" stroke-opacity="0.25" fill="none" />
    <!-- Latitude / Longitude Ellipses -->
    <ellipse cx="28" cy="28" rx="14" ry="26" stroke="#071D17" stroke-width="1" stroke-opacity="0.3" fill="none" />
    <ellipse cx="28" cy="28" rx="26" ry="11" stroke="#071D17" stroke-width="1" stroke-opacity="0.2" fill="none" />
    
    <!-- Dynamic Gold Orbit Swoosh wrapping the globe -->
    <path d="M4 38 C12 50 44 48 54 28 C58 20 54 8 42 12 C28 16 10 26 2 36" stroke="url(#goldGradLight)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    
    <!-- Orbiting Satellite Star -->
    <circle cx="53" cy="24" r="3" fill="#C59B43" />
    <circle cx="53" cy="24" r="5" stroke="#DFB967" stroke-width="1" stroke-opacity="0.6" />
    
    <!-- Center Core Glow -->
    <circle cx="28" cy="28" r="4" fill="#071D17" opacity="0.8" />
  </g>
</svg>
