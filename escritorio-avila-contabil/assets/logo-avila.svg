<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" width="280" height="72" fill="none">
  <!-- Monogram Icon -->
  <g transform="translate(4, 4)">
    <!-- Outer Shield / Diamond Container -->
    <rect x="2" y="2" width="60" height="60" rx="14" fill="#071D17" />
    <rect x="2" y="2" width="60" height="60" rx="14" stroke="#C59B43" stroke-width="1.5" stroke-opacity="0.45" />
    
    <!-- Precision Balance Axis / Geometric lines -->
    <circle cx="32" cy="32" r="22" stroke="#C59B43" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.6" />
    
    <!-- Stylized "Á" Monogram in Gold -->
    <path d="M32 16L44 46H38L35.5 39H28.5L26 46H20L32 16Z" fill="#F7F5EF" />
    <polygon points="32,23 29.8,34 34.2,34" fill="#071D17" />
    
    <!-- Accent Chevron / Accent Mark -->
    <path d="M29 11L32 8L35 11" stroke="#C59B43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Bottom Gold Base Bar -->
    <line x1="24" y1="48" x2="40" y2="48" stroke="#C59B43" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Typography Logotype -->
  <g transform="translate(80, 0)">
    <!-- Brand Primary Name: ÁVILA -->
    <text x="0" y="32" font-family="'Fraunces', 'Playfair Display', Georgia, serif" font-size="26" font-weight="600" letter-spacing="3.5" fill="#071D17">ÁVILA</text>
    
    <!-- Golden Divider Line -->
    <line x1="0" y1="40" x2="190" y2="40" stroke="#C59B43" stroke-width="1.2" stroke-opacity="0.8" />
    
    <!-- Secondary: CONTABILIDADE & CONSULTORIA -->
    <text x="0" y="52" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="8.5" font-weight="800" letter-spacing="1.8" fill="#16362E">CONTABILIDADE &amp; CONSULTORIA</text>
    
    <!-- Tagline: DESDE 1994 · SETE LAGOAS -->
    <text x="0" y="63" font-family="'Space Grotesk', monospace" font-size="7.5" font-weight="700" letter-spacing="1.5" fill="#C59B43">DESDE 1994 · SETE LAGOAS/MG</text>
  </g>
</svg>
